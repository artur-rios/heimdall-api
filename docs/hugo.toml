baseURL = 'https://artur-rios.github.io/heimdall-api/'
title = 'Heimdall API'
# Docsy ships the theme in a `theme/` subdirectory of its repository (v0.16.0+), so the
# submodule root is not itself the theme.
theme = 'docsy/theme'

enableRobotsTXT = true
enableGitInfo = true

contentDir = 'content/en'
defaultContentLanguage = 'en'

# Docsy needs these output formats for its section pages and print view
[outputs]
home = ['HTML']
page = ['HTML']
section = ['HTML', 'print', 'RSS']

# Docsy renders HTML inside markdown (shortcodes, alerts) — required
[markup]
[markup.goldmark.renderer]
unsafe = true
[markup.highlight]
# Class-based highlighting, so the palette can follow the reader's light/dark choice. The colours
# come from Docsy's per-mode Chroma stylesheets, imported in assets/scss/_styles_project.scss —
# `style` below is therefore unused, and is only what Hugo would fall back to if noClasses were
# ever set to true (which would bake one fixed palette into inline styles).
noClasses = false
style = 'tango'
[markup.tableOfContents]
startLevel = 2
endLevel = 3

# The requirements documents stay where they are — docs/requirements/ — so every existing
# link to them (README, plans, specs) keeps working, and the site renders those same files
# rather than a copy that could drift.
[module]
[[module.mounts]]
source = 'content/en'
target = 'content'
[[module.mounts]]
source = 'requirements'
target = 'content/docs/requirements'
# The ReportGenerator coverage report is served as-is, not as Hugo content — it is a
# self-contained static site of its own. The directory is generated, not committed: CI unpacks the
# Tests workflow's artifact here before building, and scripts/coverage.py writes it locally.
[[module.mounts]]
source = 'coverage-report'
target = 'static/coverage-report'
# The OpenAPI document, served as-is at /openapi/heimdall.json and fetched by the Swagger UI on
# content/en/docs/api-explorer.md. Regenerate it with scripts/openapi.py.
#
# Declaring any mount replaces Hugo's defaults, so `static/` is not mounted here and a plain
# docs/static/ directory would be ignored. Every served-as-is directory is therefore mounted
# explicitly, the same way the coverage report is.
[[module.mounts]]
source = 'openapi'
target = 'static/openapi'

[languages]
[languages.en]
label = 'English'
title = 'Heimdall API'
[languages.en.params]
description = 'A centralized identity management API with scope-based multi-tenancy, built on ASP.NET Core.'

[params]
copyright = 'Artur Rios'
github_repo = 'https://github.com/artur-rios/heimdall-api'
github_branch = 'main'
# points "Edit this page" at the right folder, since the site lives in docs/
github_subdir = 'docs'
offlineSearch = true

# Render diagrams at their natural size instead of scaling them down to the text column.
# Several diagrams here are far wider than that column — the domain-model class diagram is
# ~2570px — and fitting them to it shrank their 16px labels to about 4px. They now overflow and
# their container scrolls (see assets/scss/_styles_project.scss), which keeps the text readable.
[params.mermaid]
[params.mermaid.flowchart]
useMaxWidth = false
[params.mermaid.sequence]
useMaxWidth = false
[params.mermaid.class]
useMaxWidth = false
[params.mermaid.er]
useMaxWidth = false
[params.mermaid.state]
useMaxWidth = false
[params.mermaid.block]
useMaxWidth = false

[params.ui]
sidebar_menu_compact = false
sidebar_search_disable = false
breadcrumb_disable = false
navbar_logo = false
# Adds the Light / Dark / Auto menu to the navbar. "Auto" follows the reader's OS setting, which is
# the default until they choose otherwise. Mermaid re-renders in the matching theme on a change.
showLightDarkModeMenu = true

[params.links]
[[params.links.user]]
name = 'Artur Rios'
url = 'https://github.com/artur-rios'
icon = 'fa fa-user'
[[params.links.developer]]
name = 'GitHub'
url = 'https://github.com/artur-rios/heimdall-api'
icon = 'fab fa-github'

# Top navbar. Docsy builds the sidebar from the page tree — do NOT list docs pages here.
[menu]
[[menu.main]]
identifier = 'docs'
name = 'Documentation'
url = '/docs/'
weight = 10
[[menu.main]]
identifier = 'requirements'
name = 'Requirements'
url = '/docs/requirements/'
weight = 20
[[menu.main]]
identifier = 'api-explorer'
name = 'API Explorer'
url = '/docs/api-explorer/'
weight = 30
[[menu.main]]
identifier = 'test-coverage'
name = 'Test Coverage'
url = '/coverage-report/'
weight = 40
[[menu.main]]
identifier = 'github'
name = 'GitHub'
url = 'https://github.com/artur-rios/heimdall-api'
weight = 100
