# One file for the four environments -- Local (Docker Desktop on Windows), and Development,
# Homologation and Production, which share one Ubuntu VPS. What differs between them is
# configuration, not topology, so each environment supplies its own env file instead of its own
# Compose file. Local is deployed by hand:
#
#     docker compose --env-file docker/local.env up -d --build
#
# The three VPS environments are deployed by yggdrasil (github.com/artur-rios/yggdrasil), which
# applies its stacks/heimdall-api.proxy.yml on top of this file -- no host port, Traefik in front,
# the project named heimdall-api-<environment> -- with the env file kept on the VPS at
# /etc/yggdrasil/<environment>/heimdall-api.env, filled in from docker/<environment>.env.example.
#
# Postgres is not a service here: every host already runs one instance, shared with other services
# and environments, each owning its own database. The API reaches it over DB_HOST -- see
# docker/*.env.example and the README's "Deploy with Docker" section for what that has to be per
# environment.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${API_IMAGE:-heimdall-api}:${API_IMAGE_TAG:-latest}
    restart: unless-stopped

    # host.docker.internal is defined by Docker Desktop already, but not by the plain Docker engine
    # the VPS runs -- there it is only what this line makes it: the gateway address of the
    # container's bridge network, which is the host itself. Declaring it here is what lets the same
    # DB_HOST value work in all four environments. It is inert when DB_HOST names a real host.
    extra_hosts:
      - "host.docker.internal:host-gateway"

    environment:
      # Local and Development run as Development: Swagger is served, the developer exception page is
      # on, EF logs parameter values, and verification/reset e-mails are logged instead of sent --
      # except that the exception page and EF's logging are off on a public host (NFR-28, below).
      # Homologation runs as Staging: no Swagger and no developer exception page, but e-mails are
      # still logged rather than sent. Production turns all of that off and requires the Mailgun
      # variables below.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}

      # The host names Traefik routes to this instance (yggdrasil's overlay reads the same two). The
      # API reads them, with the verification and reset URLs and the CORS origins, only to tell
      # whether it is reachable from outside: when one names a host other than localhost, the
      # diagnostics Development and Staging ask for -- EF parameter logging, detailed errors, the
      # developer exception page -- are off, unless HEIMDALL_ALLOW_SENSITIVE_DIAGNOSTICS is true,
      # which states that the instance holds made-up people only (NFR-28). Production asks for none.
      PUBLIC_HOST: ${PUBLIC_HOST:-}
      UI_HOST: ${UI_HOST:-}
      HEIMDALL_ALLOW_SENSITIVE_DIAGNOSTICS: ${HEIMDALL_ALLOW_SENSITIVE_DIAGNOSTICS:-}

      # The API resolves its whole configuration from the environment (Startup, and
      # AddDataConfigFromEnvironment("HEIMDALL_DATA")). The Environments/.env files are for running
      # from source; none is copied into the image.
      #
      # The connection string is assembled from parts so an environment only has to state what
      # actually differs -- host, database, credentials. DB_CONNECTION_EXTRA appends anything Npgsql
      # accepts and this file should not assume, e.g. "SSL Mode=Require;Trust Server Certificate=true".
      #
      # Search Path is pinned, and it is not cosmetic. EF names the migrations history table
      # unqualified ("__EFMigrationsHistory"), so Postgres resolves it through the search path, whose
      # default is "$user", public. The entities live in a schema called heimdall; the moment the
      # login is also called heimdall -- the obvious name for this service's own role -- "$user"
      # starts resolving to that schema. The first run then records its history in public and every
      # run after it reads an empty history table in heimdall, concludes nothing was ever applied,
      # and dies on `relation "role" already exists`. Pinning the path keeps every run reading the
      # table the first one wrote.
      HEIMDALL_DATA_CONNECTIONSTRING: "Host=${DB_HOST:-host.docker.internal};Port=${DB_PORT:-5432};Database=${DB_NAME:-heimdall};Username=${DB_USER:?set DB_USER in the env file};Password=${DB_PASSWORD:?set DB_PASSWORD in the env file};Search Path=${DB_SEARCH_PATH:-public};${DB_CONNECTION_EXTRA:-}"
      HEIMDALL_DATA_DATABASETYPE: PostgreSql

      # The ES256 private key every token is signed with: base64 of a P-256 PKCS#8 PEM, one line.
      HEIMDALL_AUTH_SIGNING_KEY: ${HEIMDALL_AUTH_SIGNING_KEY:?set HEIMDALL_AUTH_SIGNING_KEY in the env file}
      # Set during a rotation: its public half stays published and its tokens stay valid (TH-22).
      HEIMDALL_AUTH_SIGNING_KEY_PREVIOUS: ${HEIMDALL_AUTH_SIGNING_KEY_PREVIOUS:-}
      HEIMDALL_AUTH_TOKEN_ISSUER: ${HEIMDALL_AUTH_TOKEN_ISSUER:-heimdall}
      HEIMDALL_AUTH_TOKEN_AUDIENCE: ${HEIMDALL_AUTH_TOKEN_AUDIENCE:-heimdall}
      HEIMDALL_AUTH_TOKEN_EXPIRATION_IN_SECONDS: ${HEIMDALL_AUTH_TOKEN_EXPIRATION_IN_SECONDS:-3600}
      # Must differ from HEIMDALL_AUTH_TOKEN_AUDIENCE, or the API refuses to start (TH-35).
      HEIMDALL_APPLICATION_TOKEN_AUDIENCE: ${HEIMDALL_APPLICATION_TOKEN_AUDIENCE:-heimdall-applications}
      HEIMDALL_APPLICATION_TOKEN_EXPIRATION_IN_SECONDS: ${HEIMDALL_APPLICATION_TOKEN_EXPIRATION_IN_SECONDS:-600}
      # A memory budget rather than a throughput dial: each derivation wants about 600 MB (TH-03).
      HEIMDALL_AUTH_MAX_CONCURRENT_PASSWORD_HASHES: ${HEIMDALL_AUTH_MAX_CONCURRENT_PASSWORD_HASHES:-4}

      # Seeded on first start, and only while the database holds no system administrator.
      HEIMDALL_MASTER_USER_NAME: ${HEIMDALL_MASTER_USER_NAME:?set HEIMDALL_MASTER_USER_NAME in the env file}
      HEIMDALL_MASTER_USER_EMAIL: ${HEIMDALL_MASTER_USER_EMAIL:?set HEIMDALL_MASTER_USER_EMAIL in the env file}
      HEIMDALL_MASTER_USER_PASSWORD: ${HEIMDALL_MASTER_USER_PASSWORD:?set HEIMDALL_MASTER_USER_PASSWORD in the env file}

      HEIMDALL_EMAIL_VERIFICATION_URL: ${HEIMDALL_EMAIL_VERIFICATION_URL:-}
      HEIMDALL_EMAIL_VERIFICATION_TOKEN_EXPIRATION_IN_SECONDS: ${HEIMDALL_EMAIL_VERIFICATION_TOKEN_EXPIRATION_IN_SECONDS:-}
      HEIMDALL_PASSWORD_RESET_URL: ${HEIMDALL_PASSWORD_RESET_URL:-}
      HEIMDALL_PASSWORD_RESET_TOKEN_EXPIRATION_IN_SECONDS: ${HEIMDALL_PASSWORD_RESET_TOKEN_EXPIRATION_IN_SECONDS:-}
      HEIMDALL_ADMIN_EMAIL_COOLDOWN_IN_SECONDS: ${HEIMDALL_ADMIN_EMAIL_COOLDOWN_IN_SECONDS:-}
      HEIMDALL_SCOPE_INVITATION_LIFETIME_IN_SECONDS: ${HEIMDALL_SCOPE_INVITATION_LIFETIME_IN_SECONDS:-}

      # Unset outside Production and both e-mails are logged instead of sent; in Production the API
      # refuses to start without them (AddEmailSenders).
      MAILGUN_API_KEY: ${MAILGUN_API_KEY:-}
      MAILGUN_DOMAIN: ${MAILGUN_DOMAIN:-}
      MAILGUN_API_VERSION: ${MAILGUN_API_VERSION:-}
      # The sender, "Name <address>" or a bare address. Unset, mail goes out from a bare
      # postmaster@$MAILGUN_DOMAIN.
      MAILGUN_FROM: ${MAILGUN_FROM:-}

      # Comma-separated Google OAuth client IDs accepted as an ID token's audience. Unset, Google
      # sign-in refuses every token rather than trusting an unverified one.
      HEIMDALL_GOOGLE_CLIENT_IDS: ${HEIMDALL_GOOGLE_CLIENT_IDS:-}
      # Empty by default, which refuses every cross-origin request. A browser front end will not
      # reach the API until its origin is listed here.
      HEIMDALL_CORS_ALLOWED_ORIGINS: ${HEIMDALL_CORS_ALLOWED_ORIGINS:-}
      # Comma-separated addresses and CIDR networks of the reverse proxy in front of the API (Traefik
      # on the VPS). X-Forwarded-For and X-Forwarded-Proto are believed from these and from no one
      # else, so the rate limiter and the request log see the real caller. Empty by default, which
      # trusts nobody: every caller is then the proxy.
      HEIMDALL_TRUSTED_PROXIES: ${HEIMDALL_TRUSTED_PROXIES:-}
      # Comma-separated secrets (each at least 32 characters) a client system presents in
      # X-Heimdall-Caller-Key to have its end users' own addresses, sent in X-Heimdall-Client-Address,
      # counted by the anonymous-auth rate limiter. Empty by default, which trusts no caller.
      HEIMDALL_TRUSTED_CALLER_KEYS: ${HEIMDALL_TRUSTED_CALLER_KEYS:-}

      # The entrypoint applies pending EF Core migrations before starting the API. false when they
      # are applied out of band -- scripts/migrations.py, or a deploy step of its own.
      HEIMDALL_RUN_MIGRATIONS: ${HEIMDALL_RUN_MIGRATIONS:-true}
      # The connection string the entrypoint migrates with, when it should not be the API's own:
      # the role that owns the schema, so DB_USER above can be a role that owns nothing (Threat
      # Model TH-18; the operations guide, "Database roles"). A whole connection string, with the
      # same Search Path as the one above. Empty, the entrypoint migrates with
      # HEIMDALL_DATA_CONNECTIONSTRING, as it always has. The API itself never reads it.
      HEIMDALL_MIGRATIONS_CONNECTIONSTRING: ${HEIMDALL_MIGRATIONS_CONNECTIONSTRING:-}

      # Refuses to start when the connection string does not require TLS, instead of warning
      # (NFR-25). Off by default so an upgrade cannot take down a deployment over a setting the
      # operator may not control; turn it on once TLS to the database is confirmed, and put
      # "SSL Mode=Require" in DB_CONNECTION_EXTRA above.
      HEIMDALL_DATA_REQUIRE_TLS: ${HEIMDALL_DATA_REQUIRE_TLS:-}

      # Retention (NFR-19 to NFR-22). Every value has a default that enforces the published
      # schedule, so a deployment that sets none of these still keeps nothing forever. They are
      # listed rather than omitted because a variable the container never receives cannot be tuned
      # at all -- and the three *_ENABLED switches are how an operator turns a pass off, which is a
      # decision worth being able to make deliberately.
      HEIMDALL_RETENTION_TOKEN_GRACE_DAYS: ${HEIMDALL_RETENTION_TOKEN_GRACE_DAYS:-}
      HEIMDALL_RETENTION_PURGE_INTERVAL_MINUTES: ${HEIMDALL_RETENTION_PURGE_INTERVAL_MINUTES:-}
      HEIMDALL_RETENTION_PURGE_BATCH_SIZE: ${HEIMDALL_RETENTION_PURGE_BATCH_SIZE:-}
      HEIMDALL_RETENTION_PURGE_ENABLED: ${HEIMDALL_RETENTION_PURGE_ENABLED:-}
      HEIMDALL_RETENTION_ERASURE_DEADLINE_DAYS: ${HEIMDALL_RETENTION_ERASURE_DEADLINE_DAYS:-}
      HEIMDALL_RETENTION_DELETION_WINDOW_DAYS: ${HEIMDALL_RETENTION_DELETION_WINDOW_DAYS:-}
      HEIMDALL_RETENTION_ANONYMISATION_ENABLED: ${HEIMDALL_RETENTION_ANONYMISATION_ENABLED:-}
      HEIMDALL_RETENTION_AUDIT_ACTOR_DAYS: ${HEIMDALL_RETENTION_AUDIT_ACTOR_DAYS:-}
      HEIMDALL_RETENTION_AUDIT_PSEUDONYMISATION_ENABLED: ${HEIMDALL_RETENTION_AUDIT_PSEUDONYMISATION_ENABLED:-}
      HEIMDALL_RETENTION_LOG_DAYS: ${HEIMDALL_RETENTION_LOG_DAYS:-}
      # Where the log files are written. The default is ./logs inside the container, which the
      # named volume below already backs — set this only if that mount changes. The signal
      # collector reads the same variable.
      HEIMDALL_LOG_DIRECTORY: ${HEIMDALL_LOG_DIRECTORY:-}

      # Security signal detection (NFR-26). Signals go to the log with a SECURITY_SIGNAL marker.
      HEIMDALL_MONITORING_ENABLED: ${HEIMDALL_MONITORING_ENABLED:-}
      HEIMDALL_MONITORING_WINDOW_MINUTES: ${HEIMDALL_MONITORING_WINDOW_MINUTES:-}
      HEIMDALL_MONITORING_REFUSAL_THRESHOLD: ${HEIMDALL_MONITORING_REFUSAL_THRESHOLD:-}
      HEIMDALL_MONITORING_LOCKOUT_THRESHOLD: ${HEIMDALL_MONITORING_LOCKOUT_THRESHOLD:-}

      # Prometheus metrics, served at /metrics on this port and on no other (Dockerfile). Blank
      # means the default, 9464 -- the port the image's ASPNETCORE_HTTP_PORTS already listens on --
      # and 0 switches metrics off entirely. A different port must be added to
      # ASPNETCORE_HTTP_PORTS as well, or Kestrel never listens where the endpoint waits.
      #
      # Deliberately absent from "ports" below. Prometheus scrapes the container over a Docker
      # network it shares with it (heimdall-api.<environment>:9464 on yggdrasil's telemetry
      # network); publishing the port would hand the metrics to anyone who can reach the host, and
      # they describe the API's traffic, its failures and its database pool closely enough to be
      # worth keeping to the operator.
      HEIMDALL_METRICS_PORT: ${HEIMDALL_METRICS_PORT:-}

    volumes:
      - logs:/app/logs

    # Host side of the mapping, so an environment can pick the interface as well as the port:
    # "8080" publishes on every interface, "127.0.0.1:8080" only to the host. Local only: on the
    # VPS yggdrasil's overlay removes the mapping, and Traefik reaches the container over a Docker
    # network.
    #
    # Only the API's port. 9464, the metrics port, is never published -- see HEIMDALL_METRICS_PORT.
    ports:
      - "${API_PORT:-8080}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

# A named volume rather than a bind mount, so the same file works unchanged on Windows and Linux --
# a host path would need a different form on each.
volumes:
  logs:
