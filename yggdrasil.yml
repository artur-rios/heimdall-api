# What Jenkins checks and deploys for this repository, read by the pipeline of the yggdrasil installation that deploys
# it (yggdrasil's docs/catalog.md, "Repository pipeline file", has every field). It is data, never code: images
# (pinned by version and digest, which Renovate keeps up to date: the owner merges those changes), commands, globs and
# the names of Jenkins credentials. The commands are scripts under ci/ that run from the repository's root, so you can
# run them on your own machine too.
#
# One file, two catalog entries (docs/catalog.md, "One repository, several entries"): the API (`heimdall-api`:
# checks test, docker, check) and its docs site (`heimdall-api-docs`: no checks of its own). Each job runs only its
# entry's checks. The docs site's job runs `test` too when it deploys, because deploy.inputs names it: the docs embed
# the coverage report that `test` makes, so its entry allows `test`'s credential as well. The docs site's image is
# docs.Dockerfile; the repository's Dockerfile is the API's.
#
# Check it where the catalog is, in the yggdrasil checkout:
#   python3 scripts/pipeline_config.py describe heimdall-api <this repository's checkout>
#   python3 scripts/pipeline_config.py describe heimdall-api-docs <this repository's checkout>

checks:
  test:                                  # Python helper tests, restore, vulnerability scan, build, migrations, tests, coverage (ci/test.sh)
    image: mcr.microsoft.com/dotnet/sdk:10.0.402@sha256:747cbade5bfd918a175ac32f8f1d931edec2c7d0d5397a3de72eaef1ac1f66d2
    run: ci/test.sh
    docker: true                         # the functional suite starts PostgreSQL through Testcontainers
    credentials:
      # ReportGenerator's PRO license. Not bound on renovate/* builds, nor when missing: the free report is made.
      REPORTGENERATOR_LICENSE: reportgenerator-license
    # The coverage report the docs site is built with (deploy.inputs), and the .trx results of every test project.
    archive: "docs/coverage-report/**,**/TestResults/*.trx"
  docker:                                # the API's container image can still be built (ci/docker.sh)
    image: docker:29.7.2-cli@sha256:3f4743208d2338c934d7b8bcfbe1bb54c0b2355c510ad5e0f31c0c4a54bd704e
    run: ci/docker.sh
    docker: true                         # the CI engine's socket: the image is built by it
  check:                                 # the committed OpenAPI document is up to date (ci/check.sh)
    image: mcr.microsoft.com/dotnet/sdk:10.0.402@sha256:747cbade5bfd918a175ac32f8f1d931edec2c7d0d5397a3de72eaef1ac1f66d2
    run: ci/check.sh
    # The generator and what it reflects over. They name the generator rather than all of tools/, because the
    # load-test tool also lives there and cannot change what the published document says.
    paths:
      - "src/**"
      - "tools/ArturRios.Heimdall.OpenApiGen/**"
      - "scripts/openapi.py"
      - "docs/openapi/**"
      - "ci/check.sh"
      - "ci/python.sh"

deploy:
  inputs: [test]                         # the docs site embeds the coverage report: its deploy runs test and copies its archive in
