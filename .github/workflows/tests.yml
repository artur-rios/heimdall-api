name: Tests

# Runs the whole test suite on every pull request and on every commit that lands on main.
#
# The two suites are separate steps of the same job rather than separate jobs: they share one
# restore and one build, and keeping them sequential means a broken unit test is reported before
# the functional suite spends minutes pulling and starting a PostgreSQL container.
#
# No path filters. A test suite is the one workflow that should run for every change — a filter
# would let a change to an unlisted path merge without evidence that anything still passes.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        # No submodules: the only one is the documentation site's theme, which no test touches.
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore src/ArturRios.Heimdall.sln

      - name: Build solution
        # Built once here so both test steps can run with --no-build and neither pays for it.
        run: dotnet build src/ArturRios.Heimdall.sln --configuration Release --no-restore

      - name: Run unit tests
        # The Category trait comes from the [UnitFact] / [UnitTheory] attributes in
        # ArturRios.Util.Test, so this filter needs no per-project configuration.
        #
        # The collector writes a coverage.cobertura.xml per project under TestResults/. Both suites
        # collect, and the report step merges every file, so the published report covers the same
        # ground as a local full-solution run — without either suite running twice.
        run: >-
          dotnet test src/ArturRios.Heimdall.sln
          --configuration Release
          --no-build
          --filter "Category=Unit"
          --collect:"XPlat Code Coverage"

      - name: Run functional tests
        # These start a real PostgreSQL container per run through Testcontainers. The
        # ubuntu-latest runner ships a working Docker daemon, so nothing extra is needed —
        # but that is the reason this suite cannot move to a Windows or macOS runner as is.
        run: >-
          dotnet test src/ArturRios.Heimdall.sln
          --configuration Release
          --no-build
          --filter "Category=Functional"
          --collect:"XPlat Code Coverage"

      - name: Install ReportGenerator
        # scripts/coverage.py calls the global tool by name, so the tools directory must be on PATH
        # — setup-dotnet does not add it.
        run: |
          dotnet tool install --global dotnet-reportgenerator-globaltool
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Generate coverage report
        # --report-only builds the HTML from the coverage files the two steps above already wrote,
        # reusing the script's own safeguards (it empties the directory first, so a page for a
        # deleted class cannot survive). Runs on pull requests too, so a change that breaks report
        # generation fails there rather than on main, where the docs site consumes the result.
        env:
          # Absent on pull requests from forks, where GitHub withholds secrets: the script then
          # generates with the free version instead of failing. Pushes to main — the only runs the
          # docs site publishes from — always have it.
          REPORTGENERATOR_LICENSE: ${{ secrets.REPORTGENERATOR_LICENSE }}
        run: python3 scripts/coverage.py --report-only

      - name: Upload coverage report
        # build-docs.yml downloads this artifact by name from the latest successful run on main and
        # unpacks it into docs/coverage-report before Hugo builds. Renaming it breaks that job.
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: docs/coverage-report
          if-no-files-found: error

      - name: Upload test results
        # Every project writes a .trx (tests/default.runsettings enables the trx logger). Keeping
        # them means the next intermittent failure names itself instead of vanishing with the log.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

  # Nothing else in CI builds the container image, and it can break on its own: the Dockerfile
  # restores from a hand-listed set of project files rather than the whole tree, so a new file that
  # restore depends on — Directory.Packages.props, when central package management was introduced —
  # is missing from the build context and fails there while every other job stays green.
  #
  # Build only, no push and no run: the point is that the image can still be produced, and the API
  # inside it is already covered by the suites above.
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
