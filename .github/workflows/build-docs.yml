name: Build Docs

# The published coverage report is not committed. This workflow downloads it from the latest
# successful Tests run on main and unpacks it into docs/coverage-report, which hugo.toml mounts at
# static/coverage-report. That is why Tests completing is a trigger here: a change under src/ moves
# the coverage numbers without touching docs/, and the push trigger below would never notice.
#
# Publishing goes through the GitHub Pages deployment API (configure-pages / upload-pages-artifact /
# deploy-pages) rather than committing the built site to a gh-pages branch. The site is then a
# deployment of a run rather than a commit somebody could push to by hand, the build output never
# enters the repository's history, and the Pages source setting is "GitHub Actions".

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      # Rendered by the site's Changelog and Contributing pages (see docs/hugo.toml).
      - 'CHANGELOG.md'
      - 'CONTRIBUTING.md'
      - '.github/workflows/build-docs.yml'
  workflow_run:
    workflows: ['Tests']
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual run'
        required: false
        default: 'Test run from GitHub UI'

# contents: read is enough now that nothing pushes a branch. pages/id-token are what the deployment
# API needs; actions: read is for reading another workflow's runs and downloading its artifact.
permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # A workflow_run trigger fires on completion, failed runs included. A failed Tests run has no
    # coverage artifact and nothing worth publishing, so only a successful one continues.
    #
    # The event check is not redundant with the branches filter above. That filter matches the head
    # branch of the triggering run, and a pull request opened from a branch named `main` — which is
    # what a fork's default branch looks like — has exactly that head branch. Without this clause,
    # anyone could deploy the site from an unmerged pull request by naming their branch main.
    #
    # The other triggers set no workflow_run context and pass on the first clause.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The Docsy theme is a submodule; without this the build fails with a missing theme.
          submodules: recursive
          # enableGitInfo needs the history to date each page.
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Docsy builds its stylesheets from the Bootstrap and Font Awesome sources in its npm
      # dependencies, so they must be present before Hugo runs. install:theme-deps (Docsy 0.17+) is
      # a lock-exact `npm ci` of the theme's own runtime dependencies, without the submodule root's
      # workspace of tooling for Docsy's own site.
      - name: Install theme dependencies
        run: npm run install:theme-deps
        working-directory: docs/themes/docsy

      # Docsy 0.17+ compiles its SCSS with Dart Sass, which Hugo looks up as the `sass` CLI on PATH;
      # Hugo bundles none, and the theme no longer builds with Hugo's embedded LibSass. The
      # standalone release is used because this site has no package.json for sass-embedded to live
      # in. The checksum is the one GitHub publishes for the release asset.
      - name: Install Dart Sass
        env:
          DART_SASS_VERSION: 1.105.1
          DART_SASS_SHA256: 9046fdd4a31a524a0020298c55d9e155d4c22363ef268e8992574335a72c6a6f
        run: |
          archive="dart-sass-${DART_SASS_VERSION}-linux-x64.tar.gz"
          curl -sSfLO "https://github.com/sass/dart-sass/releases/download/${DART_SASS_VERSION}/${archive}"
          echo "${DART_SASS_SHA256}  ${archive}" | sha256sum --check --strict
          mkdir -p "${HOME}/.local"
          tar -xzf "${archive}" -C "${HOME}/.local"
          rm "${archive}"
          echo "${HOME}/.local/dart-sass" >> "${GITHUB_PATH}"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Setup Pages
        # Only for the base URL it resolves; the build step below uses it instead of a hardcoded
        # address, so a rename of the repository or a custom domain does not need an edit here.
        id: pages
        uses: actions/configure-pages@v6

      - name: Download coverage report
        # Always the latest successful Tests run pushed to main, whatever triggered this build: on a
        # workflow_run that is the run that just finished, and on a docs-only push it is whichever
        # run last covered main. A docs change must not republish the site without the report.
        #
        # --event push is what confines publishing to main. --branch filters the head branch, and a
        # pull request run carries its own head branch — normally harmless, since feat/x never
        # matches main, but a pull request opened from a branch named main does. Pinning the event
        # means only a commit that actually landed on main can reach the published site.
        #
        # The job fails rather than deploying without it. The alternative — warn and continue —
        # publishes a site whose "Test Coverage" nav link 404s, with nobody forced to notice. If
        # this fails because the artifact aged out of its retention window, re-run Tests on main.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          run_id=$(gh run list \
            --workflow tests.yml \
            --event push \
            --branch main \
            --status success \
            --limit 1 \
            --json databaseId \
            --jq '.[0].databaseId // empty')

          if [ -z "$run_id" ]; then
            echo "::error::No successful Tests run on main to take the coverage report from. Run the Tests workflow on main, then re-run this build." >&2
            exit 1
          fi

          echo "Taking the coverage report from Tests run $run_id"
          gh run download "$run_id" --name coverage-report --dir docs/coverage-report

          if [ ! -f docs/coverage-report/index.html ]; then
            echo "::error::The coverage-report artifact from run $run_id has no index.html; the report would publish broken." >&2
            exit 1
          fi

      - name: Build Hugo site
        run: hugo -s docs --environment production --minify --cleanDestinationDir --gc --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: Upload Pages artifact
        # The single artifact deploy-pages consumes below. This is the whole published site; there
        # is no branch holding it between runs.
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/public

  # Separate job so the deployment shows as its own step with the resulting URL, and so a failure to
  # publish is distinguishable from a failure to build.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
